<!doctype html><html lang="ru"><meta charset="utf-8"><title>RoomPlan — проверка двух маршрутов</title>
<style>body{font:16px system-ui;background:#f4f5f1;color:#263c33;margin:40px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}video{width:100%;background:#111}button{padding:10px 20px}output{display:block;margin:15px 0}</style>
<h1>Фактические видео из редактора</h1><p>Оба файла скачаны через интерфейс RoomPlan. 1280×720 · 15 кадров/с · 3 секунды.</p><main>
<section><h2>Внутри комнаты</h2><video id="inside" controls preload="auto" src="round5-interior.webm"></video><button data-video="inside">Воспроизвести интерьер</button><output id="inside-status">Загрузка…</output></section>
<section><h2>Обзор сверху</h2><video id="overview" controls preload="auto" src="round5-overview.webm"></video><button data-video="overview">Воспроизвести обзор</button><output id="overview-status">Загрузка…</output></section>
</main><script>for(const v of document.querySelectorAll('video')){const show=()=>document.querySelector('#'+v.id+'-status').textContent=`${v.videoWidth}×${v.videoHeight} · ${v.currentTime.toFixed(2)} / ${v.duration.toFixed(2)} с · ${v.ended?'Завершено':v.paused?'Пауза':'Воспроизведение'}`;for(const e of ['loadedmetadata','timeupdate','playing','ended'])v.addEventListener(e,show)}for(const b of document.querySelectorAll('button'))b.onclick=()=>document.getElementById(b.dataset.video).play()</script>
