<!doctype html><html lang="en"><meta charset="utf-8"><title>RoomPlan GPU diagnostic</title><style>body{font:16px system-ui;margin:32px;background:#eef1ed}pre{white-space:pre-wrap;background:white;padding:20px}canvas{border:1px solid #999}</style><h1>GPU context diagnostic</h1><p>This page creates one small WebGL2 context and reports browser creation errors.</p><canvas id="test" width="64" height="64"></canvas><pre id="result">Checking…</pre><script>
const c=document.querySelector('#test'),out=document.querySelector('#result'),report={time:new Date().toISOString()};
c.addEventListener('webglcontextcreationerror',e=>{report.creationError=e.statusMessage;out.textContent=JSON.stringify(report,null,2)});
c.addEventListener('webglcontextlost',e=>{report.lost=e.statusMessage;out.textContent=JSON.stringify(report,null,2)});
try{const gl=c.getContext('webgl2',{preserveDrawingBuffer:true});report.created=!!gl;if(gl){report.version=gl.getParameter(gl.VERSION);report.vendor=gl.getParameter(gl.VENDOR);report.renderer=gl.getParameter(gl.RENDERER);report.maxTextureSize=gl.getParameter(gl.MAX_TEXTURE_SIZE);report.maxArrayLayers=gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS);report.maxTextureUnits=gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);report.extensions=gl.getSupportedExtensions();gl.clearColor(.3,.7,.4,1);gl.clear(gl.COLOR_BUFFER_BIT);report.error=gl.getError();}out.textContent=JSON.stringify(report,null,2)}catch(e){report.exception=String(e);out.textContent=JSON.stringify(report,null,2)}
</script></html>
